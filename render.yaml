services:
  - type: web
    name: majesty-compucare-limited
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        value: https://majesty-compucare-limited.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
        type: secret
      - key: DATABASE_URL
        sync: false
        type: secret
      - key: NEXT_PUBLIC_APP_URL
        value: https://majesty-compucare-limited.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
        type: secret
      - key: SMTP_PASS
        sync: false
        type: secret
      - key: SMTP_FROM
        value: noreply@majestycompucarelimited.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
        type: secret
      - key: CLOUDINARY_API_KEY
        sync: false
        type: secret
      - key: CLOUDINARY_API_SECRET
        sync: false
        type: secret
      - key: MPESA_CONSUMER_KEY
        sync: false
        type: secret
      - key: MPESA_CONSUMER_SECRET
        sync: false
        type: secret
      - key: MPESA_PASSKEY
        sync: false
        type: secret
      - key: MPESA_SHORTCODE
        sync: false
        type: secret
      - key: MPESA_CALLBACK_URL
        value: https://majesty-compucare-limited.onrender.com/api/mpesa/callback
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false
